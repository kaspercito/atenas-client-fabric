name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Compilar
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || VER="0.0.0-dev"
          gradle build -Pmod_version="$VER" --no-daemon
          ls build/libs
      - uses: actions/upload-artifact@v4
        with: { name: jar, path: 'build/libs/AtenasClientFabric-*[0-9].jar' }
      - name: Publicar release (solo con tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/AtenasClientFabric-*[0-9].jar
          generate_release_notes: true
